#:schema https://raw.githubusercontent.com/jackTabsCode/asphalt/refs/heads/main/schema.json

# Studio local: `asphalt sync studio` → rbxasset:// in Studio content folder.
# Cloud publish: set creator.id + ASPHALT_API_KEY, then `asphalt sync cloud`.
[creator]
type = "user"
id = 0

[codegen]
typescript = false
style = "nested"
strip_extensions = true
content = false

[inputs.GeneratedAssets]
path = "assets/images/**/*"
output_path = "src/shared"
